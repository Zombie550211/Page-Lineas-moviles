<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSP por meta: el sitio se sirve estatico desde S3 y el usuario connecting-deploy
     tiene denegado CreateResponseHeadersPolicy, asi que no se puede emitir por
     cabecera en CloudFront. El meta no soporta frame-ancestors ni report-uri;
     el clickjacking lo cubre X-Frame-Options, que CloudFront si envia.
     Al retirar Botpress ya no hay terceros mas alla de Google. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.googletagmanager.com https://www.google.com https://www.google.com.mx https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://td.doubleclick.net https://stats.g.doubleclick.net; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://td.doubleclick.net https://stats.g.doubleclick.net https://www.google.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<title>Página no encontrada | Líneas Móviles</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FAFAF8; --black:#0A0A0A; --blue:#2563EB; --muted:#6B6B6B; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',sans-serif; background:var(--cream); color:var(--black);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:2rem; text-align:center; -webkit-font-smoothing:antialiased;
  }
  .code { font-size:.7rem; font-weight:700; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-bottom:1.2rem; }
  h1 { font-family:'Cormorant Garamond',Georgia,serif; font-size:clamp(2.4rem,6vw,4rem); font-weight:600; line-height:1.05; letter-spacing:-.5px; margin-bottom:1rem; }
  h1 em { font-style:italic; color:var(--muted); }
  p { color:var(--muted); font-size:.95rem; line-height:1.7; max-width:420px; margin:0 auto 2.4rem; }
  .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a { text-decoration:none; font-size:.82rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:15px 32px; border-radius:2px; transition:opacity .2s; }
  a:hover { opacity:.85; }
  .primary { background:var(--black); color:#fff; }
  .ghost { border:1.5px solid var(--black); color:var(--black); }
</style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Esta página<br><em>no existe.</em></h1>
    <p>El enlace que seguiste no lleva a ningún lado. Vuelve al inicio o llámanos y te atendemos en español ahora mismo.</p>
    <div class="actions">
      <a class="primary" href="tel:+18884702820">📞 Llamar (888) 470-2820</a>
      <a class="ghost" href="/">Ir al inicio</a>
    </div>
  </main>
</body>
</html>
