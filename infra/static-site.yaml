AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  lineas-moviles.com — sitio estatico en S3 privado + CloudFront.
  Reemplaza el Static Site de Render. Desplegar SIEMPRE en us-east-1:
  CloudFront solo acepta certificados ACM de esa region.

Parameters:
  DomainName:
    Type: String
    Default: lineas-moviles.com
    Description: Dominio apex. Se sirve tambien www.<dominio> con 301 al apex.
  HostedZoneId:
    Type: String
    Description: ID de la hosted zone de Route 53 para DomainName.
  CertificateArn:
    Type: String
    Description: >-
      ARN del certificado ACM en us-east-1, ya VALIDADO, cubriendo
      <dominio> y www.<dominio>.

Resources:

  # ---------- Origen: bucket privado, sin acceso publico ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    # Retain evita que un `delete-stack` accidental borre el sitio.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${DomainName}-site'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: PurgarVersionesAntiguas
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  # Solo esta distribucion de CloudFront puede leer el bucket.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoloCloudFrontViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${DomainName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------- URLs limpias + redireccion de www ----------
  # Render resolvia /privacidad -> privacidad.html por su cuenta.
  # S3 no lo hace: sin esta funcion, los enlaces a las paginas legales dan 404.
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Anade .html a URLs sin extension y redirige www al apex
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function querystring(request) {
          var parts = [];
          for (var k in request.querystring) {
            var v = request.querystring[k];
            if (v.multiValue) {
              for (var i = 0; i < v.multiValue.length; i++) {
                parts.push(k + '=' + v.multiValue[i].value);
              }
            } else if (v.value) {
              parts.push(k + '=' + v.value);
            } else {
              parts.push(k);
            }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }

        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';

          // www -> apex. Conserva la querystring: sin ella se pierde el gclid
          // y Google Ads deja de atribuir la conversion.
          if (host.indexOf('www.') === 0) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: {
                  value: 'https://${DomainName}' + request.uri + querystring(request)
                }
              }
            };
          }

          var uri = request.uri;
          var last = uri.substring(uri.lastIndexOf('/') + 1);

          if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          } else if (last.indexOf('.') === -1) {
            request.uri = uri + '.html';
          }
          return request;
        }

  # ---------- Cabeceras de seguridad ----------
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        Comment: Equivalente a las cabeceras que servia render.yaml
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "frame-ancestors 'none'"
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()'
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
            # CSP completa en Report-Only para no romper Botpress ni el tag de Ads.
            # Revisar la consola del navegador y promover a Content-Security-Policy.
            - Header: Content-Security-Policy-Report-Only
              Value: >-
                default-src 'self';
                base-uri 'self';
                object-src 'none';
                form-action 'self';
                frame-ancestors 'none';
                script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.google.com https://td.doubleclick.net https://cdn.botpress.cloud https://files.bpcontent.cloud https://*.botpress.cloud;
                style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                font-src 'self' data: https://fonts.gstatic.com https://*.botpress.cloud;
                img-src 'self' data: blob: https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.google.com https://td.doubleclick.net https://cdn.botpress.cloud https://files.bpcontent.cloud https://*.botpress.cloud;
                connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.google.com https://td.doubleclick.net https://*.botpress.cloud wss://*.botpress.cloud;
                frame-src 'self' https://www.googletagmanager.com https://td.doubleclick.net https://*.botpress.cloud;
                upgrade-insecure-requests
              Override: true

  # ---------- Distribucion ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Sitio estatico ${DomainName}'
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # Trafico solo de EEUU: PriceClass_100 evita pagar edges de Asia/Oceania.
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # S3 con OAC responde 403 a objetos inexistentes. Sin esto el visitante
          # ve un XML de AWS en vez de una pagina, y Google indexa "soft 404".
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300

  # ---------- DNS ----------
  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        # Zona fija de CloudFront, igual en todas las cuentas.
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Value: !Ref SiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-bucket'
  DistributionId:
    Value: !Ref Distribution
    Export:
      Name: !Sub '${AWS::StackName}-distribution'
  DistributionDomain:
    Description: Dominio de CloudFront, para probar ANTES de mover el DNS.
    Value: !GetAtt Distribution.DomainName
